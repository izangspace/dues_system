<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student - NACOS Dues</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">NACOS Dues</div>
            <nav>
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/register">Register</a></li>
                    <li><a href="/student_login">Student Login</a></li>
                    <li><a href="/admin_login">Admin Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="form-container">
        <h2>Student Registration</h2>

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="message success">{{ success }}</div>
        {% endif %}

        <form action="/register" method="POST" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="text" name="matric_no" placeholder="Matric Number" required>
            <input type="email" name="email" placeholder="Email" required>

            <select name="level" required>
                <option value="">Select Level</option>
                <option value="100">100 Level</option>
                <option value="200">200 Level</option>
                <option value="300">300 Level</option>
                <option value="400">400 Level</option>
            </select>

            <input type="password" name="password" placeholder="Password" required>

            <label for="image">Upload Profile Picture (optional):</label>
            <input type="file" name="image" id="image" accept="image/*">

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
