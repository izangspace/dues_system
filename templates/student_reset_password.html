<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="form-container">
    <h2>Reset Password</h2>

    {% if error %}
        <div class="message error">{{ error }}</div>
    {% endif %}
    {% if success %}
        <div class="message success">{{ success }}</div>
    {% endif %}

    <form action="{{ url_for('student_reset_password') }}" method="POST">
        <input type="text" name="matric_no" placeholder="Matric Number" required value="{{ matric_no or '' }}">
        <input type="email" name="email" placeholder="Email" required value="{{ email or '' }}">

        {% if verify_stage %}
            <input type="hidden" name="stage" value="verify">
            <input type="text" name="verification_code" placeholder="Verification Code" required>
            <input type="password" name="password" placeholder="New Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
            <button type="submit">Confirm Reset</button>
        {% else %}
            <button type="submit">Send Verification Code</button>
        {% endif %}
    </form>

    {% if show_code %}
        <p class="success">Verification code: <strong>{{ verification_code }}</strong></p>
    {% endif %}

    <p class="forgot-link"><a href="{{ url_for('student_login') }}">← Back to login</a></p>
</div>

</body>
</html>
