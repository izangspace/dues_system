<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>
<body>

<h2>All Students</h2>

{% for s in students %}
<div style="border:1px solid black; margin:10px; padding:10px;">
    <p>Name: {{ s[1] }}</p>
    <p>Matric No: {{ s[2] }}</p>
    <p>Email: {{ s[3] }}</p>
    <p>Level: {{ s[4] }}</p>

    <img src="{{ url_for('static', filename='uploads/' + s[6]) }}" width="100">
</div>
{% endfor %}

</body>
</html>
